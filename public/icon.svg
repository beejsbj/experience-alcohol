<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="lamp" cx="50%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#6a4125"/>
      <stop offset="55%" stop-color="#3b2414"/>
      <stop offset="100%" stop-color="#160d07"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf8f1"/>
      <stop offset="100%" stop-color="#e9e1d1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#lamp)"/>
  <!-- a glass ring left on the wood -->
  <circle cx="392" cy="398" r="70" fill="none" stroke="#120904" stroke-width="7" stroke-dasharray="330 110" opacity="0.7"/>
  <g transform="rotate(-8 256 262)">
    <path d="M150 78 L 362 78 L 362 446 L 150 446 Z" fill="#000" opacity="0.55" filter="url(#shadow)" transform="translate(10 18)"/>
    <path d="M150 84 L162 72 L174 84 L186 72 L198 84 L210 72 L222 84 L234 72 L246 84 L258 72 L270 84 L282 72 L294 84 L306 72 L318 84 L330 72 L342 84 L354 72 L362 80 L362 440 L354 452 L342 440 L330 452 L318 440 L306 452 L294 440 L282 452 L270 440 L258 452 L246 440 L234 452 L222 440 L210 452 L198 440 L186 452 L174 440 L162 452 L150 440 Z" fill="url(#paper)"/>
    <!-- dot-matrix masthead -->
    <g fill="#2b2824">
      <rect x="184" y="112" width="144" height="12" rx="2" opacity="0.9"/>
      <rect x="214" y="134" width="84" height="7" rx="2" opacity="0.6"/>
    </g>
    <line x1="176" y1="160" x2="336" y2="160" stroke="#2b2824" stroke-width="4" stroke-dasharray="10 8" opacity="0.6"/>
    <!-- the big printed number -->
    <g fill="#2b2824">
      <rect x="180" y="186" width="34" height="52" rx="3"/>
      <rect x="222" y="226" width="12" height="12" rx="2"/>
      <rect x="242" y="186" width="34" height="52" rx="3"/>
      <rect x="284" y="186" width="34" height="52" rx="3"/>
    </g>
    <g fill="#f7f3ea">
      <rect x="190" y="196" width="14" height="32" rx="2"/>
      <rect x="252" y="196" width="14" height="32" rx="2"/>
      <rect x="294" y="196" width="14" height="32" rx="2"/>
    </g>
    <!-- ledger lines -->
    <g fill="#5b564d" opacity="0.75">
      <rect x="180" y="272" width="110" height="8" rx="2"/>
      <rect x="306" y="272" width="30" height="8" rx="2"/>
      <rect x="180" y="296" width="90" height="8" rx="2"/>
      <rect x="306" y="296" width="30" height="8" rx="2"/>
      <rect x="180" y="320" width="120" height="8" rx="2"/>
      <rect x="306" y="320" width="30" height="8" rx="2"/>
    </g>
    <!-- a pen loop round the last one, and the tally -->
    <path d="M170 318 C 160 296, 330 294, 346 318 C 356 340, 190 348, 168 330 C 160 322, 176 310, 196 306" fill="none" stroke="#C7521F" stroke-width="7" stroke-linecap="round"/>
    <g stroke="#C7521F" stroke-width="8" stroke-linecap="round">
      <line x1="190" y1="370" x2="186" y2="410"/>
      <line x1="210" y1="368" x2="207" y2="410"/>
      <line x1="230" y1="370" x2="228" y2="410"/>
    </g>
  </g>
</svg>
